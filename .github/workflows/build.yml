name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter create. --platforms=android --project-name jb_express_card
      - run: |
          cat > lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MyApp());
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  backgroundColor: Colors.green[50],
                  appBar: AppBar(title: const Text('JB EXPRESS 1'), backgroundColor: Colors.green[800]),
                  body: Center(
                    child: Column(mainAxisAlignment: MainAxisAlignment.center, children: const [
                      Icon(Icons.local_shipping, size: 80, color: Colors.green),
                      SizedBox(height: 20),
                      Text('JB EXPRESS 1', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
                      Text('Muhammad Shakeel - Chachro', style: TextStyle(fontSize: 18)),
                      SizedBox(height: 10),
                      Text('Digital Visiting Card'),
                    ]),
                  ),
                ),
              );
            }
          }
          ENDDART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jb-express-apk
          path: build/app/outputs/flutter-apk/app-release.apk
